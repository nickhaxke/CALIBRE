<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reader · {{INSTITUTION_NAME}}</title>
  <link rel="stylesheet" href="/static/css/reader.css">
  <style id="reader-theme">:root { --green: {{PRIMARY_COLOR}}; }</style>
</head>
<body>
  <header class="reader-topbar" role="banner">
    <div class="topbar-left">
      <a id="btn-back-catalogue" href="/calibre/institutional" class="back-btn" title="Back to Library Catalogue">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to Catalogue</span>
      </a>
      <div class="brand-badge">
        <span class="brand-seal" id="reader-seal">
          <img id="reader-logo" src="{{LOGO_URL}}" alt="{{INSTITUTION_SHORT_NAME}}" onerror="this.style.display='none';document.getElementById('reader-seal-text').style.display='inline';">
          <span id="reader-seal-text" style="display:none;">{{INSTITUTION_SHORT_NAME}}</span>
        </span>
        <div class="book-meta-head">
          <strong id="reader-book-title">Loading publication…</strong>
          <small id="reader-book-subtitle">{{INSTITUTION_NAME}}</small>
        </div>
      </div>
    </div>

    <div class="topbar-center" role="toolbar" aria-label="PDF Page and Zoom Controls">
      <button type="button" id="btn-toggle-sidebar" class="tool-btn" title="Toggle Pages &amp; Search Sidebar" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        <span class="btn-label">Pages</span>
      </button>

      <div class="divider" aria-hidden="true"></div>

      <button type="button" id="btn-prev-page" class="tool-btn nav-pill-btn" title="Previous Page (Left Arrow)" aria-label="Previous Page" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span class="nav-btn-text">Previous</span>
      </button>

      <form id="page-jump-form" class="page-indicator" aria-label="Page navigation">
        <input id="page-input" type="number" min="1" max="1" value="1" aria-label="Current page number">
        <span class="page-of">of</span>
        <span id="page-total">—</span>
      </form>

      <button type="button" id="btn-next-page" class="tool-btn nav-pill-btn nav-pill-next" title="Next Page (Right Arrow)" aria-label="Next Page" disabled>
        <span class="nav-btn-text">Next Page</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <div class="divider" aria-hidden="true"></div>

      <button type="button" id="btn-scroll-mode" class="tool-btn mode-toggle-btn" title="Switch between Single Page and Continuous Vertical Scroll" aria-pressed="false">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v18"></path>
          <polyline points="8 7 12 3 16 7"></polyline>
          <polyline points="8 17 12 21 16 17"></polyline>
        </svg>
        <span id="scroll-mode-label">Continuous Scroll</span>
      </button>

      <div class="divider" aria-hidden="true"></div>

      <button type="button" id="btn-zoom-out" class="tool-btn" title="Zoom Out (-)" aria-label="Zoom Out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>
      <span id="zoom-level" class="zoom-readout" aria-live="polite">100%</span>
      <button type="button" id="btn-zoom-in" class="tool-btn" title="Zoom In (+)" aria-label="Zoom In">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>

      <button type="button" id="btn-fit-width" class="tool-btn active" title="Fit to Width">Fit Width</button>
      <button type="button" id="btn-fit-page" class="tool-btn" title="Fit Full Page">Fit Page</button>
    </div>

    <div class="topbar-right">
      <button type="button" id="btn-share-link" class="tool-btn" title="Copy Direct Sharing Link" aria-label="Copy Direct Sharing Link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
        <span class="btn-label" id="share-btn-text">Share</span>
      </button>

      <button type="button" id="btn-search-toggle" class="tool-btn" title="Search within Document (Ctrl+F)" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span class="btn-label">Find</span>
      </button>

      <a id="btn-download-pdf" href="#" class="tool-btn download-btn" hidden title="Download PDF">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span class="btn-label">Download</span>
      </a>

      <button type="button" id="btn-fullscreen" class="tool-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
    </div>
  </header>

  <div class="reader-workspace">
    <aside id="reader-sidebar" class="reader-sidebar" hidden aria-label="Document Pages and Search Results">
      <div class="sidebar-tabs" role="tablist">
        <button type="button" id="tab-pages" class="sidebar-tab active" role="tab" aria-selected="true">Pages</button>
        <button type="button" id="tab-search" class="sidebar-tab" role="tab" aria-selected="false">Search inside PDF</button>
      </div>

      <div id="panel-pages" class="sidebar-panel" role="tabpanel">
        <div id="page-list" class="page-list"></div>
      </div>

      <div id="panel-search" class="sidebar-panel" role="tabpanel" hidden>
        <form id="pdf-search-form" class="pdf-search-form">
          <input id="pdf-search-input" type="search" placeholder="Find word or phrase in PDF…" aria-label="Find in PDF" autocomplete="off">
          <button type="submit" id="pdf-search-submit" class="pdf-search-btn">Find</button>
        </form>
        <div id="pdf-search-status" class="pdf-search-status" aria-live="polite"></div>
        <div id="pdf-search-results" class="pdf-search-results"></div>
      </div>
    </aside>

    <!-- Prominent Floating Left/Right Side Page Turners -->
    <button type="button" id="floating-prev-btn" class="floating-side-nav floating-side-prev" title="Go to Previous Page (Left Arrow)" aria-label="Previous Page" disabled>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      <span>Previous</span>
    </button>

    <button type="button" id="floating-next-btn" class="floating-side-nav floating-side-next" title="Go to Next Page (Right Arrow)" aria-label="Next Page" disabled>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
      <span>Next Page</span>
    </button>

    <main id="reader-stage" class="reader-stage" tabindex="0" aria-label="PDF Document Viewer">
      <div id="reader-loading" class="reader-loading" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p id="loading-message">Loading publication…</p>
      </div>

      <div id="reader-error" class="reader-error" role="alert" hidden>
        <div class="error-card">
          <h2 id="error-title">Unable to Open Publication</h2>
          <p id="error-message">The requested PDF document could not be loaded.</p>
          <a id="error-back-link" href="/calibre/institutional" class="error-back-btn">← Return to Library Catalogue</a>
        </div>
      </div>

      <!-- Single Page Mode Viewport -->
      <div id="page-viewport" class="page-viewport" hidden>
        <div id="page-sheet" class="page-sheet">
          <img id="pdf-page-img" alt="Rendered PDF Page" draggable="false">
        </div>
      </div>

      <!-- Continuous Vertical Scroll Mode Viewport -->
      <div id="scroll-viewport" class="scroll-viewport" hidden aria-label="Continuous Scroll Document Pages"></div>
    </main>

    <!-- Prominent Floating Bottom Navigation Bar -->
    <nav id="reader-bottom-bar" class="reader-bottom-bar" aria-label="Quick Page Navigation">
      <button type="button" id="bottom-prev-btn" class="bottom-nav-btn" title="Previous Page" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Previous Page</span>
      </button>

      <div class="bottom-bar-center">
        <span id="bottom-page-status" class="bottom-page-status">Page 1 of 1</span>
        <button type="button" id="bottom-mode-btn" class="bottom-mode-pill" title="Toggle Continuous Vertical Scroll">
          Scroll Down Mode: Off
        </button>
      </div>

      <button type="button" id="bottom-next-btn" class="bottom-nav-btn bottom-nav-next" title="Next Page" disabled>
        <span>Next Page</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </nav>
  </div>

  <script src="/static/js/reader.js" defer></script>
</body>
</html>
